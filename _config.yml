# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Static Webpage # <-- EDIT THIS: Leave as 'blank' to use your full name, or type a custom site title (e.g., "My Portfolio")
first_name: AM # <-- EDIT THIS: Your actual first name
middle_name: M # <-- EDIT THIS: Your middle name (or leave blank/remove this line)
last_name: Tyb # <-- EDIT THIS: Your actual last name
contact_note: >
  You can send me an email for any comments/suggestions. # <-- EDIT THIS: Optional note for your contact section
description: > 
  A simple wbpage for showcasing what or what not to do when learning the machine learning. # <-- EDIT THIS: A short 1-2 sentence description of yourself/your site
footer_text: >
   Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
   Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
  # Photos from <a href="https://unsplash.com" target="_blank">Unsplash</a>. # <-- EDIT THIS: You can change or remove the Unsplash credit if you don't use their photos
keywords: Learning, Deep Learning, AI, CV # <-- EDIT THIS: Add 3-5 keywords related to your field (helps with search engines)
lang: en # <-- EDIT THIS: Your site's language (e.g., en, fr, es, hi, etc.)
icon: ✅  # <-- EDIT THIS: The emoji for your browser tab, or replace with an image filename (e.g., "favicon.png") located in /assets/img/

url: "https://tyb1110.github.io" # <-- CRITICAL: REPLACE 'abc1234' WITH YOUR ACTUAL GITHUB USERNAME
baseurl: "" # <-- CRITICAL: LEAVE EXACTLY LIKE THIS (two quotes with nothing inside) for a main user site

last_updated: true # <-- EDIT THIS: Set to false if you don't want "Last updated" dates on your pages
impressum_path: # <-- EDIT THIS: Leave blank unless you need a legal imprint page (required in some EU countries)
back_to_top: true # <-- EDIT THIS: Set to false to disable the "scroll to top" button

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: dark # <-- EDIT THIS: GitHub stats theme for light mode (e.g., default, dark, dark_dimmed)
repo_theme_dark: dark # <-- EDIT THIS: GitHub stats theme for dark mode
repo_trophies:
  enabled: true # <-- EDIT THIS: Set to false if you don't want GitHub profile trophies on your site
  theme_light: flat 
  theme_dark: gitdimmed 

# External service URLs for repository page (Usually fine to leave as default)
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------
# (Leave this section as default unless you know you need to change it)

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false  # <-- EDIT THIS: Set to false if you don't want a CV/Resume page
    distill:
      enabled: true
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true # <-- EDIT THIS: Set to false if you want the top menu to scroll away
footer_fixed: true # <-- EDIT THIS: Set to false if you want the footer to scroll away
search_enabled: true # <-- EDIT THIS: Set to false to disable the site search bar
socials_in_search: true
posts_in_search: true
bib_search: true

max_width: 930px # <-- EDIT THIS: Adjust the maximum width of your site content (e.g., 800px, 1000px)

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: false # <-- EDIT THIS: Set to true if you want nice preview cards when sharing links on Twitter/LinkedIn
serve_schema_org: false # <-- EDIT THIS: Set to true for better search engine understanding of your content
og_image: # <-- EDIT THIS: Add a filename (e.g., "assets/img/preview.jpg") if serve_og_meta is true

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

analytics:
  google: # <-- EDIT THIS: Add your Google Analytics ID (e.g., "G-XXXXXXXXXX") if you want to track visitors
  cronitor: 
  pirsch: 
  openpanel: 

google_site_verification: # <-- EDIT THIS: Add your Google Search Console verification code (optional)
bing_site_verification: # <-- EDIT THIS: Add your Bing Webmaster verification code (optional)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Chronicles of tyb # <-- EDIT THIS: The title that appears on your blog page (e.g., "My Tech Blog")
blog_description: showcasing what or what not to do when learning the machine learning # <-- EDIT THIS: Short description for your blog page
permalink: /blog/:year/:title/
lsi: false 

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus comments (Optional: Only edit if you want to add a comment section to your blog posts)
giscus:
  repo: # <-- EDIT THIS: Your GitHub repo name (e.g., "abc1234/abc1234.github.io")
  repo_id: # <-- EDIT THIS: Your repo_id from https://giscus.app/
  category: Comments 
  category_id: # <-- EDIT THIS: Your category_id from https://giscus.app/
  mapping: title 
  strict: 1 
  reactions_enabled: 1 
  input_position: bottom 
  dark_theme: dark 
  light_theme: light 
  emit_metadata: 0
  lang: en

# Disqus comments (DEPRECATED - Leave blank unless you specifically want to use Disqus)
disqus_shortname: 

# External sources (Optional: Only edit if you want to pull in posts from Medium, Substack, etc.)
external_sources:
  - name: medium.com
    rss_url: https://medium.com/@al-folio/fee # <-- EDIT THIS: Your actual Medium/Substack RSS feed URL
    categories: [external-posts]
    tags: [medium]

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false # <-- EDIT THIS: Set to true if you want to collect email subscribers
  endpoint: # <-- EDIT THIS: Your newsletter service endpoint (e.g., Loops, Mailchimp)

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
# (These control which folders generate pages. Leave as default unless you want to remove a section)

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
# (Leave this entire bottom section exactly as it is. It tells GitHub how to process your site.)

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - AGENTS.md
  - al-folio-upgrade-report.md
  - bin/
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Use al_folio_core as the theme runtime; local files can still override theme files.
theme: al_folio_core

# Plug-ins
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  # al-folio plugins
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  # CSS is already minified upstream (Tailwind build ships tailwind.css; main.scss is compiled
  # with sass `style: compressed`). Re-minifying via cssminify2 mangles Tailwind v4 spacing
  # tokens inside calc(), turning `var(--spacing)` into the invalid `var( -  - spacing)` and
  # breaking every spacing/positioning utility (e.g. .fixed-top -> broken navbar). Disable it.
  compress_css: false
  # JS minification is delegated to jekyll-terser (compress_javascript above is false).
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).

display_tags: ["formatting", "images", "links", "math", "code", "blockquotes"] # these tags will be displayed on the front page of your blog
display_categories: ["external-services"] # these categories will be displayed on the front page of your blog

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Display different badges withs stats for your publications
# Customize badge behavior in _layouts/bib.liquid
enable_publication_badges:
  altmetric: true # Altmetric badge (Customization options: https://badge-docs.altmetric.com/index.html)
  dimensions: true # Dimensions badge (Customization options: https://badge.dimensions.ai/)
  google_scholar: true # Google Scholar badge (https://scholar.google.com/intl/en/scholar/citations.html)
  inspirehep: true # Inspire HEP badge (https://help.inspirehep.net/knowledge-base/citation-metrics/)

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

# These are the defaults
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_verification: false # enables google site verification
enable_bing_verification: false # enables bing site verification
enable_cookie_consent: false # enables GDPR-compliant cookie consent dialog (https://github.com/orestbida/cookieconsent)
enable_masonry: true # enables automatic project cards arrangement
enable_math: true # enables math typesetting (uses MathJax)
enable_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable_darkmode: true # enables switching between light/dark modes
enable_navbar_social: false # enables displaying social links in the navbar on the about page
enable_project_categories: true # enables categorization of projects into multiple categories
enable_medium_zoom: true # enables image zoom feature (as on medium.com)
enable_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable_video_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

